[alembic]
# Path to migration scripts
script_location = alembic

# Template used when generating new migrations
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

# SQLite URL can be overridden via command line (-x db_url=...)
sqlalchemy.url = sqlite:///./test.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
