name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BACKEND_IMAGE: personal-finance-backend:ci
  FRONTEND_IMAGE: personal-finance-frontend:ci
  POSTGRES_DB: finance_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: root12345
  POSTGRES_PORT: 5433

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black==23.9.1 flake8

      - name: Run black (check)
        run: |
          black --check backend/src || (echo "Run black to format" && exit 1)

      - name: Run flake8
        run: |
          flake8 backend/src || (echo "Fix lint issues" && exit 1)

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Run eslint
        working-directory: frontend
        run: |
          npx eslint src || (echo "Fix frontend lint issues" && exit 1)

  test-backend:
    name: Backend Tests (migrations + seed + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd="pg_isready -U ${{ env.POSTGRES_USER }}" 
          --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install alembic pytest psycopg2-binary

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }} && break
            sleep 1
          done

      - name: Run Alembic migrations
        working-directory: db
        run: |
          # ensure env can import backend models; add backend src to PYTHONPATH
          export PYTHONPATH="${{ github.workspace }}/backend/src:${PYTHONPATH}"
          alembic upgrade head

      - name: Run seed SQL (idempotent)
        run: |
          psql "postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}" -f db/seed/categories_seed.sql

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
        run: |
          pytest -q

  build-images:
    name: Build Docker Images (optional)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}
